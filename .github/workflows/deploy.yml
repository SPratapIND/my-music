name: Deploy Music Player to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository (including Git LFS files)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build playlist from music folder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python tools/build_playlist.py

      - name: Verify music store
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("music/playlist.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          songs = data.get("songs", [])
          print(f"Songs in playlist.json: {len(songs)}")
          for s in songs[:10]:
              print("-", s.get("src"))
          if not songs:
              raise SystemExit("No supported audio files were found in music/.")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
