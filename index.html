<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Music">
  <meta name="description" content="Personal static music player for GitHub Pages.">
  <title>🎵 My Music</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="music-app" id="musicApp">
    <aside class="sidebar">
      <div class="sidebar-header">🎵 My Music</div>

      <div class="sidebar-controls">
        <label for="folderUpload" class="upload-button">📁 Add Local Music</label>
        <input id="folderUpload" type="file" multiple webkitdirectory directory accept="audio/*" hidden>
        <div class="store-status" id="storeStatus">Loading music store…</div>

        <div class="search-box">
          <input id="searchInput" type="search" placeholder="🔍 Search music..." autocomplete="off">
        </div>
      </div>

      <div id="musicList" class="song-list" aria-label="Music library"></div>
    </aside>

    <main class="player-area">
      <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>

      <div class="player-glass">
        <div id="albumArt" class="album-art" aria-label="Album artwork">🎵</div>

        <div class="now-playing">
          <div id="currentTitle" class="now-title">No song selected</div>
          <div id="currentArtist" class="now-artist"></div>
        </div>

        <div class="visualizer-wrap">
          <canvas id="visualizer"></canvas>
        </div>

        <div class="player">
          <input id="progress" class="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Track position">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>

          <div class="controls">
            <button class="control-button" id="previousButton" title="Previous" aria-label="Previous">⏮</button>
            <button class="control-button" id="backButton" title="Back 10 seconds" aria-label="Back 10 seconds">⏪</button>
            <button id="playButton" class="play-button" title="Play / Pause" aria-label="Play / Pause">▶</button>
            <button class="control-button" id="forwardButton" title="Forward 10 seconds" aria-label="Forward 10 seconds">⏩</button>
            <button class="control-button" id="nextButton" title="Next" aria-label="Next">⏭</button>
          </div>

          <div class="secondary-controls">
            <button id="shuffleButton" class="secondary-button" title="Shuffle">🔀 Shuffle</button>
            <button id="autoplayButton" class="secondary-button active" title="Autoplay">▶ Autoplay</button>
            <button id="repeatButton" class="secondary-button" title="Repeat">🔁 Repeat</button>
            <button id="equalizerButton" class="secondary-button" title="Equalizer">🎚 Equalizer</button>
            <button id="fullscreenButton" class="secondary-button" title="Full Screen">⛶ Full Screen</button>
          </div>
          <div class="fullscreen-hint" id="fullscreenHint">
            Open the player in full screen for a larger music-view experience.
          </div>
        </div>
      </div>

      <section id="equalizerPanel" class="equalizer-panel" aria-label="Equalizer">
        <div class="equalizer-header">
          <div class="equalizer-title">🎚 10-Band Equalizer</div>
          <div class="eq-header-actions">
            <select id="equalizerPreset" class="equalizer-preset" aria-label="Equalizer preset">
              <option value="flat">Flat</option>
              <option value="bass">Bass Boost</option>
              <option value="vocal">Vocal</option>
              <option value="rock">Rock</option>
              <option value="electronic">Electronic</option>
            </select>
            <button id="eqCloseButton" class="eq-icon-button" title="Close">✕</button>
          </div>
        </div>

        <div id="equalizerBands" class="equalizer-bands"></div>

        <div class="eq-preamp">
          <span>Preamp</span>
          <input id="eqPreamp" type="range" min="-12" max="6" value="0" step="0.5" aria-label="Preamp">
          <span id="eqPreampValue">0.0 dB</span>
        </div>

        <div class="eq-footer">
          <button id="eqResetButton" class="eq-secondary-action">Reset to Flat</button>
          <button id="eqSaveCloseButton" class="eq-save-button">💾 Save &amp; Close</button>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
